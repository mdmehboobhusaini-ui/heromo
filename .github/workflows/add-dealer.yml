name: Add New Dealer

on:
  workflow_dispatch:
    inputs:
      dealer_url:
        description: 'Dealer URL'
        required: true
      folder_name:
        description: 'Folder Name'
        required: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Run scraper
        run: python scripts/scraper.py "${{ github.event.inputs.dealer_url }}" "${{ github.event.inputs.folder_name }}"
      - name: Commit changes
        run: |
          git config user.email "bot@hero.com"
          git config user.name "Hero Bot"
          git add .
          git commit -m "Add dealer: ${{ github.event.inputs.folder_name }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
